<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานคะแนนห้องเรียน | Student Council</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        .table-header { @apply px-4 py-4 text-center text-sm font-bold text-gray-600 uppercase tracking-wider bg-green-50 border-b-2 border-green-100; }
        .table-cell { @apply px-2 py-4 text-center border-b border-gray-100 text-sm font-medium; }
        .badge-green { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-yellow { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .badge-red { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .current-day-col { background-color: #f0fdf4; color: #15803d; border-bottom-color: #16a34a; }
        .total-cell { font-weight: 800; font-size: 1.1rem; }

        /* ซ่อน Scrollbar */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background-color: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print, button, a { display: none !important; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
            .overflow-x-auto { overflow-x: visible !important; }
            .bg-white { background-color: white !important; }
            table { width: 100% !important; border-collapse: collapse; }
            th, td { border: 1px solid #ddd !important; padding: 4px !important; font-size: 12px; }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-green-600 shadow-sm"><i class="fas fa-chalkboard text-3xl"></i></div>
                <div><h1 class="text-2xl font-extrabold text-gray-800">รายงานห้องเรียน</h1><p class="text-gray-500 font-medium">คะแนนความสะอาดรายวัน</p></div>
            </div>
            
            <div class="flex gap-2 items-center no-print">
                <button onclick="window.print()" class="h-10 px-4 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 font-bold transition flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button onclick="showSummary()" class="h-10 px-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg shadow-lg hover:shadow-green-500/30 hover:-translate-y-0.5 font-bold transition flex items-center gap-2">
                    <i class="fas fa-medal text-yellow-300"></i> สรุปผล
                </button>
                <a href="weekly-report.html" class="h-10 px-4 bg-white text-green-600 border border-green-200 rounded-lg shadow hover:bg-green-50 font-bold transition flex items-center gap-2"><i class="fas fa-bed"></i> ดูหอพัก</a>
            </div>
        </div>

        <div class="flex gap-2 overflow-x-auto hide-scroll pb-2 no-print" id="grade-filters">
            <button onclick="setFilter('All')" id="filter-All" class="px-5 py-2 rounded-full font-bold text-sm transition bg-green-600 text-white shadow-md border border-green-600 whitespace-nowrap scale-105">ทั้งหมด</button>
            <button onclick="setFilter('ม.1')" id="filter-ม.1" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.1</button>
            <button onclick="setFilter('ม.2')" id="filter-ม.2" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.2</button>
            <button onclick="setFilter('ม.3')" id="filter-ม.3" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.3</button>
            <button onclick="setFilter('ม.4')" id="filter-ม.4" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.4</button>
            <button onclick="setFilter('ม.5')" id="filter-ม.5" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.5</button>
            <button onclick="setFilter('ม.6')" id="filter-ม.6" class="px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap">ม.6</button>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-green-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-bold text-gray-600 uppercase tracking-wider bg-green-50 border-b-2 border-green-100 w-32">ห้องเรียน</th>
                            <th class="table-header day-col-1">จันทร์</th>
                            <th class="table-header day-col-2">อังคาร</th>
                            <th class="table-header day-col-3">พุธ</th>
                            <th class="table-header day-col-4">พฤหัส</th>
                            <th class="table-header day-col-5">ศุกร์</th>
                            <th class="table-header text-green-700 bg-green-100 border-green-200">สัปดาห์</th>
                            <th class="table-header text-white bg-green-600">สะสม</th>
                        </tr>
                    </thead>
                    <tbody id="classroom-tbody" class="bg-white divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>

        <div id="class-summary-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4 no-print">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-all" id="modal-box">
                <div class="bg-green-600 p-5 text-white flex justify-between items-center">
                    <h2 class="text-xl font-bold"><i class="fas fa-crown mr-2 text-yellow-300"></i><span id="summary-title">Top Classrooms</span></h2>
                    <button onclick="closeSummary()" class="hover:text-green-200"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div class="p-6 bg-gradient-to-b from-green-50 to-white">
                    <div id="top-class-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = '/api/scores';
        const today = new Date().getDay();
        let classData = [];
        let currentFilter = 'All'; // ตัวแปรเก็บสถานะการกรองปัจจุบัน

        async function fetchAndRender() {
            try {
                const res = await fetch(API_URL);
                const allData = await res.json();
                classData = allData.filter(d => d.type === 'classroom');
                
                // เรียงลำดับตามชื่อห้อง
                classData.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

                renderTable();

                if(today >= 1 && today <= 5) {
                    document.querySelectorAll(`.day-col-${today}`).forEach(el => {
                        el.classList.add('current-day-col');
                        el.innerHTML += ' <i class="fas fa-caret-down ml-1"></i>';
                    });
                }
            } catch (err) { console.error(err); }
        }

        // 🔥 ฟังก์ชันกรอง
        function setFilter(grade) {
            currentFilter = grade;
            
            // อัปเดตสีปุ่ม
            document.querySelectorAll('#grade-filters button').forEach(btn => {
                if(btn.id === `filter-${grade}`) {
                    btn.className = "px-5 py-2 rounded-full font-bold text-sm transition bg-green-600 text-white shadow-md border border-green-600 whitespace-nowrap scale-105";
                } else {
                    btn.className = "px-5 py-2 rounded-full font-bold text-sm transition bg-white text-gray-600 border border-gray-200 hover:bg-green-50 whitespace-nowrap";
                }
            });

            renderTable();
        }

        function renderTable() {
            // กรองข้อมูลตามที่เลือก
            const filteredData = currentFilter === 'All' 
                ? classData 
                : classData.filter(item => item.name.startsWith(currentFilter));

            const tbody = document.getElementById('classroom-tbody');
            
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400">ไม่พบข้อมูลของชั้น ${currentFilter}</td></tr>`;
                return;
            }

            tbody.innerHTML = filteredData.map((item, index) => {
                const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-green-50/30';
                let daysHtml = '';
                let weeklyTotal = 0;

                for (let i = 1; i <= 5; i++) {
                    const score = item[`points_class_${i}`];
                    const reason = item[`reason_points_class_${i}`] || '';
                    const isToday = i === today ? 'bg-green-50/50' : '';

                    if(score !== undefined && score !== null) {
                        weeklyTotal += parseInt(score);
                        let cls = score===10 ? 'badge-green' : (score>=8 ? 'badge-yellow' : 'badge-red');
                        let reasonHtml = reason ? `<span class="ml-2 text-xs text-gray-700 font-bold text-left break-words max-w-[80px] leading-tight no-print">${reason}</span>` : '';
                        daysHtml += `<td class="table-cell ${isToday} align-middle"><div class="flex items-center justify-center min-h-[40px]"><span class="${cls} inline-flex flex-shrink-0 items-center justify-center w-8 h-8 rounded-full text-sm font-bold shadow-sm">${score}</span>${reasonHtml}</div></td>`;
                    } else {
                        daysHtml += `<td class="table-cell ${isToday} align-middle"><span class="text-gray-300 font-light">-</span></td>`;
                    }
                }

                // คำนวณยอดสะสม (Accumulated + Weekly)
                const grandTotal = (item.accumulated_score || 0) + weeklyTotal;

                return `<tr class="${rowClass} hover:bg-green-50 transition duration-150"><td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-700 text-left border-b border-gray-100 align-middle">${item.name}</td>${daysHtml}<td class="table-cell total-cell text-green-700 border-l border-green-100 align-middle">${weeklyTotal}</td><td class="table-cell total-cell text-white bg-green-600 align-middle shadow-sm">${grandTotal}</td></tr>`;
            }).join('');
        }

        // 🔥 ฟังก์ชันแสดงผลสรุป (กรองตามที่เลือก)
        function showSummary() {
            const list = document.getElementById('top-class-list');
            list.innerHTML = '';

            // ใช้ข้อมูลที่ผ่านการกรองแล้วมาคำนวณ
            const filteredData = currentFilter === 'All' 
                ? classData 
                : classData.filter(item => item.name.startsWith(currentFilter));

            // เปลี่ยนชื่อหัวข้อ Modal
            document.getElementById('summary-title').innerText = currentFilter === 'All' ? 'Top Classrooms (รวม)' : `Top Classrooms (${currentFilter})`;

            const ranking = filteredData.map(c => {
                let w = 0;
                for(let i=1; i<=5; i++) w += (parseInt(c[`points_class_${i}`]) || 0);
                return { name: c.name, total: (c.accumulated_score || 0) + w };
            }).sort((a,b) => b.total - a.total).slice(0, 5); // เอา 5 อันดับแรก

            if (ranking.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 py-4">ไม่มีข้อมูล</div>';
            } else {
                ranking.forEach((r, i) => {
                    let badge = i===0 ? '🥇' : (i===1 ? '🥈' : (i===2 ? '🥉' : `#${i+1}`));
                    let style = i===0 ? 'bg-green-600 text-white ring-4 ring-green-100 scale-105' : 'bg-white text-gray-700 border border-green-100';
                    
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-4 rounded-xl shadow-sm ${style} transition">
                            <div class="flex items-center gap-3">
                                <span class="text-xl w-8 text-center">${badge}</span>
                                <span class="font-bold text-lg">${r.name}</span>
                            </div>
                            <span class="font-black text-xl">${r.total}</span>
                        </div>
                    `;
                });
            }

            const m = document.getElementById('class-summary-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
            setTimeout(() => document.getElementById('modal-box').classList.remove('scale-95'), 10);
        }

        function closeSummary() {
            const m = document.getElementById('class-summary-modal');
            document.getElementById('modal-box').classList.add('scale-95');
            setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 150);
        }

        document.addEventListener('DOMContentLoaded', fetchAndRender);
    </script>
</body>
</html>
