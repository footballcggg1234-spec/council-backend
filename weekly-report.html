<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานคะแนนหอพักประจำสัปดาห์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .table-header { @apply px-2 py-3 text-center text-xs font-bold uppercase tracking-wider border-b-2; }
        .table-cell { @apply px-2 py-3 text-center border-b border-gray-100 text-sm font-medium align-middle; } 
        .badge-green { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-yellow { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .badge-red { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .total-cell { font-weight: 800; font-size: 1.1rem; vertical-align: middle; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* 🔥 CSS สำหรับการพิมพ์ PDF */
        @media print {
            @page { size: A4 landscape; margin: 10mm; } /* แนวนอน */
            body { background-color: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print, button, a { display: none !important; } /* ซ่อนปุ่ม */
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-2xl { box-shadow: none !important; } /* ลบเงา */
            .overflow-hidden { overflow: visible !important; } /* ให้ตารางยืดได้ */
            .overflow-x-auto { overflow-x: visible !important; }
            .bg-white { background-color: white !important; }
            h1 { font-size: 24px !important; color: black !important; }
            p { color: #333 !important; }
            table { width: 100% !important; border-collapse: collapse; }
            th, td { border: 1px solid #ddd !important; padding: 4px !important; font-size: 12px !important; }
            .grid { display: block !important; } /* เปลี่ยน Grid เป็น Block เพื่อให้เรียงลงมา */
            .grid > div { margin-bottom: 20px; page-break-inside: avoid; } /* ห้ามตัดกลางตาราง */
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen relative">

    <div class="max-w-[1600px] mx-auto space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-2">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800">รายงานคะแนนหอพัก</h1>
                <p class="text-gray-500 font-medium mt-1">
                    <i class="far fa-calendar-alt mr-2"></i>อัปเดตแบบ Real-time
                </p>
            </div>
            
            <div class="flex flex-col items-end gap-2 no-print">
                <div class="flex gap-2 text-xs font-bold bg-white px-3 py-2 rounded-lg shadow-sm border">
                    <span class="text-gray-500 mr-1">เกณฑ์:</span>
                    <span class="text-green-700"><span class="w-2 h-2 rounded-full bg-green-500 inline-block mr-1"></span>3 ผ่าน</span>
                    <span class="text-yellow-700"><span class="w-2 h-2 rounded-full bg-yellow-500 inline-block mr-1"></span>2 ปรับปรุง</span>
                    <span class="text-red-700"><span class="w-2 h-2 rounded-full bg-red-500 inline-block mr-1"></span>1 ไม่ผ่าน</span>
                </div>
                <div class="flex gap-2">
                     <button onclick="window.print()" class="px-4 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 font-bold transition flex items-center gap-2">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                     <button onclick="showMonthlySummary()" class="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg shadow-lg hover:shadow-blue-500/30 hover:-translate-y-0.5 font-bold transition flex items-center gap-2">
                        <i class="fas fa-trophy text-yellow-300"></i> สรุปผล
                    </button>
                     <a href="classroom-weekly.html" class="px-4 py-2 bg-white text-green-600 border border-green-200 rounded-lg shadow hover:bg-green-50 font-bold transition flex items-center gap-2">
                        <i class="fas fa-chalkboard"></i> ห้องเรียน
                    </a>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <div class="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-hidden">
                <div class="p-5 bg-blue-50 border-b border-blue-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 text-xl"><i class="fas fa-running"></i></div>
                        <h2 class="text-xl font-bold text-gray-800">ตรวจออกกายบริหาร</h2>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-blue-600 uppercase bg-blue-50/50 border-b border-blue-100 w-24">หอพัก</th>
                                <th class="table-header text-gray-500 day-col-1">จ.</th>
                                <th class="table-header text-gray-500 day-col-2">อ.</th>
                                <th class="table-header text-gray-500 day-col-3">พ.</th>
                                <th class="table-header text-gray-500 day-col-4">พฤ.</th>
                                <th class="table-header text-gray-500 day-col-5">ศ.</th>
                                <th class="table-header text-blue-600 bg-blue-50 w-16">สัปดาห์</th>
                                <th class="table-header text-white bg-blue-500 w-16">สะสม</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-exercise"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-purple-100 overflow-hidden">
                <div class="p-5 bg-purple-50 border-b border-purple-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600 text-xl"><i class="fas fa-bed"></i></div>
                        <h2 class="text-xl font-bold text-gray-800">ตรวจหอนอน</h2>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-purple-600 uppercase bg-purple-50/50 border-b border-purple-100 w-24">หอพัก</th>
                                <th class="table-header text-gray-500 day-col-1">จ.</th>
                                <th class="table-header text-gray-500 day-col-2">อ.</th>
                                <th class="table-header text-gray-500 day-col-3">พ.</th>
                                <th class="table-header text-gray-500 day-col-4">พฤ.</th>
                                <th class="table-header text-gray-500 day-col-5">ศ.</th>
                                <th class="table-header text-purple-600 bg-purple-50 w-16">สัปดาห์</th>
                                <th class="table-header text-white bg-purple-500 w-16">สะสม</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-dorm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="summary-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 no-print">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl overflow-hidden transform scale-95 transition-all flex flex-col max-h-[90vh]" id="modal-content">
                <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-5 text-white flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-yellow-400 text-2xl shadow-inner"><i class="fas fa-crown"></i></div>
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight">สรุปผลคะแนนรวมประจำเดือน</h2>
                            <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Monthly Leaderboard</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i class="fas fa-times text-lg"></i></button>
                </div>
                <div class="p-6 md:p-8 overflow-y-auto custom-scrollbar bg-gray-50 flex-1">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                        <div class="bg-white rounded-3xl shadow-sm border border-blue-100 overflow-hidden flex flex-col h-full">
                            <div class="bg-blue-600 p-4 text-white text-center relative overflow-hidden"><h3 class="text-xl font-black relative z-10 uppercase tracking-widest"><i class="fas fa-mars mr-2"></i>หอพักชาย</h3></div>
                            <div class="p-6 flex flex-col items-center flex-1 bg-gradient-to-b from-blue-50 to-white">
                                <div class="relative mb-8 mt-2 transform hover:scale-105 transition duration-500">
                                    <i class="fas fa-crown text-5xl text-yellow-400 absolute -top-8 left-1/2 -translate-x-1/2 drop-shadow-lg animate-bounce"></i>
                                    <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-400 p-1.5 shadow-xl shadow-blue-500/40"><div class="w-full h-full bg-white rounded-full flex items-center justify-center text-3xl font-black text-blue-600 border-4 border-white" id="winner-male">-</div></div>
                                </div>
                                <div id="list-male" class="w-full space-y-3"></div>
                            </div>
                        </div>
                        <div class="bg-white rounded-3xl shadow-sm border border-pink-100 overflow-hidden flex flex-col h-full">
                            <div class="bg-pink-600 p-4 text-white text-center relative overflow-hidden"><h3 class="text-xl font-black relative z-10 uppercase tracking-widest"><i class="fas fa-venus mr-2"></i>หอพักหญิง</h3></div>
                            <div class="p-6 flex flex-col items-center flex-1 bg-gradient-to-b from-pink-50 to-white">
                                <div class="relative mb-8 mt-2 transform hover:scale-105 transition duration-500">
                                    <i class="fas fa-crown text-5xl text-yellow-400 absolute -top-8 left-1/2 -translate-x-1/2 drop-shadow-lg animate-bounce" style="animation-delay: 0.2s;"></i>
                                    <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 p-1.5 shadow-xl shadow-pink-500/40"><div class="w-full h-full bg-white rounded-full flex items-center justify-center text-3xl font-black text-pink-600 border-4 border-white" id="winner-female">-</div></div>
                                </div>
                                <div id="list-female" class="w-full space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = '/studentcouncil/api/scores'; 
const today = new Date().getDay();
let globalData = [];

async function fetchAndRender() {
    try {
        const res = await fetch(API_URL);
        globalData = await res.json();
        
        // กรองข้อมูลเฉพาะประเภท 'dorm'
        const dormData = globalData.filter(d => d.type === 'dorm');
        
        // เรียงลำดับชื่อหอพัก
        dormData.sort((a, b) => {
             const typeA = a.name.includes('ชาย') ? 1 : 2;
             const typeB = b.name.includes('ชาย') ? 1 : 2;
             if(typeA !== typeB) return typeA - typeB;
             return (parseInt(a.name.match(/\d+/)) || 0) - (parseInt(b.name.match(/\d+/)) || 0);
        });

        renderTable('tbody-exercise', dormData, 'points_exercise', 'blue');
        renderTable('tbody-dorm', dormData, 'points_dorm', 'purple');
    } catch (error) { console.error('Fetch error:', error); }
}

        function renderTable(elementId, data, keyPrefix, colorTheme) {
            const tbody = document.getElementById(elementId);
            const totalColor = colorTheme === 'blue' ? 'text-blue-600 bg-blue-50' : 'text-purple-600 bg-purple-50';
            const accumColor = colorTheme === 'blue' ? 'bg-blue-600' : 'bg-purple-600';

            tbody.innerHTML = data.map((item, index) => {
                const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';
                let daysHtml = '';
                let weeklyTotal = 0;

                for (let i = 1; i <= 5; i++) {
                    let dayScore = item[`${keyPrefix}_${i}`];
                    let dayReason = item[`reason_${keyPrefix}_${i}`] || "";
                    const isTodayClass = (i === today) ? 'bg-yellow-50' : '';
                    
                    if (dayScore) {
                        weeklyTotal += parseInt(dayScore);
                        // 🔥 แก้ไขการแสดงหมายเหตุ (ซ่อนตอนปริ้น)
                        let reasonHtml = dayReason ? `<span class="ml-2 text-[10px] text-gray-500 font-normal text-left break-words max-w-[80px] leading-tight no-print">${dayReason}</span>` : '';
                        daysHtml += `<td class="table-cell px-2 align-middle min-w-[60px] ${isTodayClass}"><div class="flex items-center justify-center min-h-[40px]"><span class="inline-flex flex-shrink-0 items-center justify-center w-6 h-6 rounded-full text-xs font-bold shadow-sm ${getBadgeColor(dayScore)}">${dayScore}</span>${reasonHtml}</div></td>`;
                    } else {
                        daysHtml += `<td class="table-cell text-gray-300 align-middle ${isTodayClass}">-</td>`;
                    }
                }

                const grandTotal = (item.accumulated_score || 0) + weeklyTotal;

                return `<tr class="${rowBg} hover:bg-gray-100 transition"><td class="px-4 py-3 text-sm font-bold text-gray-700 text-left border-b border-gray-100 align-middle">${item.name}</td>${daysHtml}<td class="table-cell total-cell ${totalColor} border-l border-gray-100 align-middle">${weeklyTotal}</td><td class="table-cell total-cell text-white ${accumColor} align-middle shadow-sm">${grandTotal}</td></tr>`;
            }).join('');
        }

        function getBadgeColor(score) {
            score = parseInt(score);
            if (score === 3) return 'badge-green';
            if (score === 2) return 'badge-yellow';
            return 'badge-red';
        }

        function showMonthlySummary() {
            const summaryData = globalData.filter(d => d.type === 'dorm').map(d => {
                const wEx = [1,2,3,4,5].reduce((a, b) => a + (parseInt(d[`points_exercise_${b}`]) || 0), 0);
                const wDo = [1,2,3,4,5].reduce((a, b) => a + (parseInt(d[`points_dorm_${b}`]) || 0), 0);
                return {
                    name: d.name,
                    gender: d.gender || (d.name.includes('ชาย') ? 'male' : 'female'),
                    total: (d.accumulated_score || 0) + wEx + wDo
                };
            });

            const males = summaryData.filter(d => d.gender === 'male').sort((a,b) => b.total - a.total);
            const females = summaryData.filter(d => d.gender === 'female').sort((a,b) => b.total - a.total);

            document.getElementById('winner-male').innerText = males.length > 0 ? males[0].name.replace('หอนอนชาย', 'ช.') : '-';
            document.getElementById('winner-female').innerText = females.length > 0 ? females[0].name.replace('หอนอนหญิง', 'ญ.') : '-';

            renderSummaryList('list-male', males, 'blue');
            renderSummaryList('list-female', females, 'pink');

            const modal = document.getElementById('summary-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('modal-content').classList.remove('scale-95'), 10);
        }

        function renderSummaryList(containerId, data, color) {
            const list = document.getElementById(containerId);
            list.innerHTML = '';
            
            data.forEach((s, i) => {
                const isTop = i === 0;
                let cardClass = isTop 
                    ? (color === 'blue' ? 'bg-blue-600 text-white ring-4 ring-blue-200' : 'bg-pink-600 text-white ring-4 ring-pink-200')
                    : 'bg-white text-gray-700 border border-gray-100 hover:bg-gray-50';
                
                let rankBadge = isTop ? '🥇' : (i===1 ? '🥈' : (i===2 ? '🥉' : `<span class="bg-gray-200 text-gray-500 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">${i+1}</span>`));
                let scoreColor = isTop ? 'text-white' : (color === 'blue' ? 'text-blue-600' : 'text-pink-600');

                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl shadow-sm transition transform hover:scale-[1.01] ${cardClass}">
                        <div class="flex items-center gap-3">
                            <div class="w-8 flex justify-center text-lg">${rankBadge}</div>
                            <span class="font-bold text-sm md:text-base">${s.name}</span>
                        </div>
                        <div class="font-black text-lg ${scoreColor} px-2">${s.total}</div>
                    </div>
                `;
            });
        }

        function closeModal() {
            const modal = document.getElementById('summary-modal');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 150);
        }

        document.addEventListener('DOMContentLoaded', fetchAndRender);
    </script>
</body>
</html>
