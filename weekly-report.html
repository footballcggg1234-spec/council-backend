<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานคะแนนหอพักประจำสัปดาห์ | Student Council</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .table-header { @apply px-2 py-3 text-center text-xs font-bold uppercase tracking-wider border-b-2; }
        .table-cell { @apply px-2 py-3 text-center border-b border-gray-100 text-sm font-medium align-middle; } 
        .badge-green { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-yellow { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .badge-red { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .total-cell { font-weight: 800; font-size: 1.1rem; vertical-align: middle; }
        
        /* Scrollbar สวยๆ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen relative">

    <div class="max-w-[1600px] mx-auto space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-2">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800">รายงานคะแนนหอพัก</h1>
                <p class="text-gray-500 font-medium mt-1">
                    <i class="far fa-calendar-alt mr-2"></i>อัปเดตแบบ Real-time (จันทร์ - ศุกร์)
                </p>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <div class="flex gap-2 text-xs font-bold bg-white px-3 py-2 rounded-lg shadow-sm border">
                    <span class="text-gray-500 mr-1">เกณฑ์:</span>
                    <span class="text-green-700"><span class="w-2 h-2 rounded-full bg-green-500 inline-block mr-1"></span>3 ผ่าน</span>
                    <span class="text-yellow-700"><span class="w-2 h-2 rounded-full bg-yellow-500 inline-block mr-1"></span>2 ปรับปรุง</span>
                    <span class="text-red-700"><span class="w-2 h-2 rounded-full bg-red-500 inline-block mr-1"></span>1 ไม่ผ่าน</span>
                </div>
                <div class="flex gap-2">
                     <button onclick="showMonthlySummary()" class="px-6 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg shadow-lg hover:shadow-purple-500/30 hover:-translate-y-0.5 font-bold transition flex items-center gap-2">
                        <i class="fas fa-trophy text-yellow-300"></i> สรุปผลประจำเดือน
                    </button>
                     <a href="classroom-weekly.html" class="px-4 py-2 bg-white text-green-600 border border-green-200 rounded-lg shadow hover:bg-green-50 font-bold transition flex items-center gap-2">
                        <i class="fas fa-chalkboard"></i> ห้องเรียน
                    </a>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">

            <div class="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-hidden">
                <div class="p-5 bg-blue-50 border-b border-blue-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 text-xl"><i class="fas fa-running"></i></div>
                        <h2 class="text-xl font-bold text-gray-800">ตรวจออกกายบริหาร</h2>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-blue-600 uppercase bg-blue-50/50 border-b border-blue-100 w-24">หอพัก</th>
                                <th class="table-header text-gray-500 day-col-1">จ.</th>
                                <th class="table-header text-gray-500 day-col-2">อ.</th>
                                <th class="table-header text-gray-500 day-col-3">พ.</th>
                                <th class="table-header text-gray-500 day-col-4">พฤ.</th>
                                <th class="table-header text-gray-500 day-col-5">ศ.</th>
                                <th class="table-header text-blue-600 bg-blue-50 w-16">สัปดาห์</th>
                                <th class="table-header text-white bg-blue-500 w-16">สะสม</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-exercise"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-purple-100 overflow-hidden">
                <div class="p-5 bg-purple-50 border-b border-purple-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600 text-xl"><i class="fas fa-bed"></i></div>
                        <h2 class="text-xl font-bold text-gray-800">ตรวจหอนอน</h2>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-purple-600 uppercase bg-purple-50/50 border-b border-purple-100 w-24">หอพัก</th>
                                <th class="table-header text-gray-500 day-col-1">จ.</th>
                                <th class="table-header text-gray-500 day-col-2">อ.</th>
                                <th class="table-header text-gray-500 day-col-3">พ.</th>
                                <th class="table-header text-gray-500 day-col-4">พฤ.</th>
                                <th class="table-header text-gray-500 day-col-5">ศ.</th>
                                <th class="table-header text-purple-600 bg-purple-50 w-16">สัปดาห์</th>
                                <th class="table-header text-white bg-purple-500 w-16">สะสม</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-dorm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="summary-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden transform scale-95 transition-all flex flex-col max-h-[90vh]" id="modal-content">
                
                <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-6 text-white flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-yellow-400 text-xl"><i class="fas fa-crown"></i></div>
                        <div>
                            <h2 class="text-xl font-bold">สรุปผลคะแนนประจำเดือน</h2>
                            <p class="text-xs text-slate-400">Monthly Leaderboard</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i class="fas fa-times"></i></button>
                </div>

                <div class="p-6 md:p-8 overflow-y-auto custom-scrollbar bg-gray-50">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div class="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-hidden flex flex-col">
                            <div class="bg-blue-50 p-4 border-b border-blue-100 text-center">
                                <h3 class="text-blue-800 font-extrabold text-lg"><i class="fas fa-male mr-2"></i>หอพักชาย</h3>
                            </div>
                            <div class="p-6 flex flex-col items-center bg-gradient-to-b from-blue-50/50 to-white">
                                <div class="relative mb-6">
                                    <i class="fas fa-crown text-4xl text-yellow-400 absolute -top-6 left-1/2 -translate-x-1/2 drop-shadow-md animate-bounce"></i>
                                    <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 p-1 shadow-lg shadow-blue-500/30">
                                        <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-3xl font-black text-blue-600" id="winner-male">-</div>
                                    </div>
                                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-yellow-400 text-yellow-900 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">WINNER</div>
                                </div>
                                <div id="list-male" class="w-full space-y-2"></div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col">
                            <div class="bg-pink-50 p-4 border-b border-pink-100 text-center">
                                <h3 class="text-pink-800 font-extrabold text-lg"><i class="fas fa-female mr-2"></i>หอพักหญิง</h3>
                            </div>
                            <div class="p-6 flex flex-col items-center bg-gradient-to-b from-pink-50/50 to-white">
                                <div class="relative mb-6">
                                    <i class="fas fa-crown text-4xl text-yellow-400 absolute -top-6 left-1/2 -translate-x-1/2 drop-shadow-md animate-bounce" style="animation-delay: 0.2s;"></i>
                                    <div class="w-24 h-24 rounded-full bg-gradient-to-br from-pink-400 to-pink-600 p-1 shadow-lg shadow-pink-500/30">
                                        <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-3xl font-black text-pink-600" id="winner-female">-</div>
                                    </div>
                                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-yellow-400 text-yellow-900 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">WINNER</div>
                                </div>
                                <div id="list-female" class="w-full space-y-2"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = '/api/scores';
        const today = new Date().getDay();
        let globalData = [];

        async function fetchAndRender() {
            try {
                const res = await fetch(API_URL);
                globalData = await res.json();
                
                const dormData = globalData.filter(d => d.type === 'dorm');
                
                // เรียงลำดับสำหรับตารางหลัก (แยกชายหญิง แล้วเรียงตามเลข)
                dormData.sort((a, b) => {
                     const typeA = a.name.includes('ชาย') ? 1 : 2;
                     const typeB = b.name.includes('ชาย') ? 1 : 2;
                     if(typeA !== typeB) return typeA - typeB;
                     const numA = parseInt(a.name.match(/\d+/)) || 0;
                     const numB = parseInt(b.name.match(/\d+/)) || 0;
                     return numA - numB;
                });

                renderTable('tbody-exercise', dormData, 'points_exercise', 'blue');
                renderTable('tbody-dorm', dormData, 'points_dorm', 'purple');

                if(today >= 1 && today <= 5) {
                    document.querySelectorAll(`.day-col-${today}`).forEach(el => {
                        el.classList.add('bg-yellow-100', 'text-yellow-700');
                        el.innerHTML += ' <i class="fas fa-caret-down"></i>';
                    });
                }
            } catch (error) { console.error('Error:', error); }
        }

        function renderTable(elementId, data, keyPrefix, colorTheme) {
            const tbody = document.getElementById(elementId);
            const totalColor = colorTheme === 'blue' ? 'text-blue-600 bg-blue-50' : 'text-purple-600 bg-purple-50';
            const accumColor = colorTheme === 'blue' ? 'bg-blue-600' : 'bg-purple-600';

            tbody.innerHTML = data.map((item, index) => {
                const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';
                let daysHtml = '';
                let weeklyTotal = 0;

                for (let i = 1; i <= 5; i++) {
                    let dayScore = item[`${keyPrefix}_${i}`];
                    let dayReason = item[`reason_${keyPrefix}_${i}`] || "";
                    const isTodayClass = (i === today) ? 'bg-yellow-50' : '';
                    
                    if (dayScore) {
                        weeklyTotal += parseInt(dayScore);
                        let reasonHtml = dayReason ? `<span class="ml-2 text-[10px] text-gray-500 font-normal text-left break-words max-w-[80px] leading-tight">${dayReason}</span>` : '';
                        daysHtml += `<td class="table-cell px-2 align-middle min-w-[60px] ${isTodayClass}"><div class="flex items-center justify-center min-h-[40px]"><span class="inline-flex flex-shrink-0 items-center justify-center w-6 h-6 rounded-full text-xs font-bold shadow-sm ${getBadgeColor(dayScore)}">${dayScore}</span>${reasonHtml}</div></td>`;
                    } else {
                        daysHtml += `<td class="table-cell text-gray-300 align-middle ${isTodayClass}">-</td>`;
                    }
                }

                // คำนวณยอดสะสม (Accumulated + Weekly)
                const grandTotal = (item.accumulated_score || 0) + weeklyTotal;

                return `<tr class="${rowBg} hover:bg-gray-100 transition"><td class="px-4 py-3 text-sm font-bold text-gray-700 text-left border-b border-gray-100 align-middle">${item.name}</td>${daysHtml}<td class="table-cell total-cell ${totalColor} border-l border-gray-100 align-middle">${weeklyTotal}</td><td class="table-cell total-cell text-white ${accumColor} align-middle">${grandTotal}</td></tr>`;
            }).join('');
        }

        function getBadgeColor(score) {
            score = parseInt(score);
            if (score === 3) return 'badge-green';
            if (score === 2) return 'badge-yellow';
            return 'badge-red';
        }

        // --- 🏆 Summary Logic (แยกชาย/หญิง) ---
        function showMonthlySummary() {
            // 1. คำนวณคะแนนรวมทั้งหมด
            const summaryData = globalData.filter(d => d.type === 'dorm').map(d => {
                const wEx = [1,2,3,4,5].reduce((a, b) => a + (parseInt(d[`points_exercise_${b}`]) || 0), 0);
                const wDo = [1,2,3,4,5].reduce((a, b) => a + (parseInt(d[`points_dorm_${b}`]) || 0), 0);
                return {
                    name: d.name,
                    gender: d.gender, // ใช้ gender จาก DB หรือเดาจากชื่อถ้าไม่มี
                    total: (d.accumulated_score || 0) + wEx + wDo
                };
            });

            // 2. แยกชาย/หญิง และเรียงลำดับ
            // ถ้าใน DB ไม่ได้เก็บ gender ให้ใช้ .name.includes('ชาย') แทน
            const males = summaryData.filter(d => d.gender === 'male' || d.name.includes('ชาย')).sort((a,b) => b.total - a.total);
            const females = summaryData.filter(d => d.gender === 'female' || d.name.includes('หญิง')).sort((a,b) => b.total - a.total);

            // 3. Render ผู้ชนะ (Top 1)
            document.getElementById('winner-male').innerText = males.length > 0 ? males[0].name.replace('หอนอนชาย', 'ช.') : '-';
            document.getElementById('winner-female').innerText = females.length > 0 ? females[0].name.replace('หอนอนหญิง', 'ญ.') : '-';

            // 4. Render รายการ (Function Helper)
            renderSummaryList('list-male', males, 'blue');
            renderSummaryList('list-female', females, 'pink');

            // 5. Show Modal
            const modal = document.getElementById('summary-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('modal-content').classList.remove('scale-95'), 10);
        }

        function renderSummaryList(containerId, data, color) {
            const list = document.getElementById(containerId);
            list.innerHTML = '';
            
            data.forEach((s, i) => {
                const isTop = i === 0;
                let rankClass = isTop 
                    ? (color === 'blue' ? 'bg-blue-600 text-white border-blue-600' : 'bg-pink-600 text-white border-pink-600') 
                    : 'bg-white text-gray-600 border-gray-100 hover:bg-gray-50';
                
                let icon = isTop ? '🥇' : (i===1 ? '🥈' : (i===2 ? '🥉' : `<span class="text-xs font-bold text-gray-400">#${i+1}</span>`));
                
                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl border ${rankClass} shadow-sm transition">
                        <div class="flex items-center gap-3">
                            <div class="w-8 text-center text-lg">${icon}</div>
                            <span class="font-bold text-sm md:text-base">${s.name}</span>
                        </div>
                        <div class="font-black text-lg ${isTop ? 'text-white' : (color === 'blue' ? 'text-blue-600' : 'text-pink-600')}">${s.total}</div>
                    </div>
                `;
            });
        }

        function closeModal() {
            const modal = document.getElementById('summary-modal');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 150);
        }

        document.addEventListener('DOMContentLoaded', fetchAndRender);
    </script>
</body>
</html>
